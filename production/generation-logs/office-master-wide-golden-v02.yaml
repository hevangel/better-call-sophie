prompt: >-
  Empty interior of a small storefront office in an Albuquerque strip mall, year 2030, set up like a
  small-time lawyer's office but run by a young moral philosopher. Wide establishing shot from the
  front-door corner, eye level, 16:9. The back wall is floor-to-ceiling dark-wood bookshelves packed
  with worn philosophy books, with a small white marble Socrates bust on the top-right shelf. In front
  of the shelves stands a large, slightly scuffed dark walnut executive desk facing the front of the
  room, with a high-backed leather desk chair behind it; on the desk are a lit green glass banker's
  lamp, three stacked books, a closed silver laptop and a brass business-card holder. Two client
  chairs face the desk from the front: an oxblood leather wingback and a simpler matching visitor
  chair. On the left wall hangs a large slate chalkboard in a wooden frame with a hand-drawn chalk
  trolley-problem diagram: a trolley on tracks that split toward small stick figures. Beside the
  shelves hang framed diplomas and certificates, and a gaudy gold-framed print of a classical painting
  of ancient philosophers debating. A small waiting bench and a coat stand sit near the front. Warm
  cream plaster walls, a cheap drop ceiling, a faded Persian-style rug, a worn wood-look floor. The
  storefront window is behind the camera: golden-hour sun pours through its half-open venetian blinds
  and lays warm slatted shadows across the floor, desk and chairs. The mood is a strip-mall lawyer's
  office that tries a little too hard to look important, made scholarly and personal by its
  philosopher owner: confident, theatrical, a bit shabby, proud. No classical columns, no round
  windows, no flags, no statues of liberty. Photorealistic, cinematic, prestige TV production design.
  No people, no readable text, no logos, no watermarks.

